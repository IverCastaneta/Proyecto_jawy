<ion-content class="ion-padding payment-modal">

  <div *ngIf="paso === 1" class="animate__animated animate__fadeIn">
    
    <div class="sheet-handle"></div>

    <div class="custom-header">
      <ion-icon name="chevron-back-outline" class="back-btn-icon" (click)="dismissModal()"></ion-icon>

      <p class="subtitle">Reserva ahora en {{ lugar?.nombre || 'este lugar' }}</p>
      <h2 class="title-orange">Selecciona la fecha</h2>
      
      <div class="availability-badge">
        <span class="dot"></span> DISPONIBLE
      </div>
    </div>
    <div class="calendar-wrapper">
      <ion-datetime 
        presentation="date" 
        [(ngModel)]="fecha" 
        size="cover" 
        class="premium-datetime"
        locale="es-ES">
      </ion-datetime>
    </div>

    <div class="input-group ion-margin-top px-15">
      <ion-textarea class="custom-textarea" rows="2" placeholder="Mensaje al dueño (Ej: Requerimientos...)" [(ngModel)]="mensaje"></ion-textarea>
    </div>

    <ion-button expand="block" mode="ios" class="main-btn-orange" (click)="enviarSolicitud()" [disabled]="!fecha">
      Solicitar Reserva
    </ion-button>
  </div>

  <div *ngIf="paso === 2" class="success-screen-orange animate__animated animate__fadeIn">
    
    <div class="success-content">
      <div class="dark-circle">
        <ion-icon name="checkmark-sharp"></ion-icon>
      </div>
      
      <h1 class="success-title">¡Se completo la solicitud<br>exitosamente!</h1>
      
      <p class="success-message">
        Espera pacientemente a que el dueño del lugar nos de la aprobación.
      </p>
      
      <ion-button expand="block" mode="ios" class="btn-dark-return" (click)="dismissModal()">
        Volver a explorar
      </ion-button>
    </div>

  </div>

</ion-content>

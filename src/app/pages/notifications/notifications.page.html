<ion-header class="ion-no-border jawy-header">
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Notificaciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="jawy-bg">
  <div class="main-container">
    
    <div class="notifications-list" *ngIf="notificaciones.length > 0; else emptyState">
      <div 
        class="notification-card animate__animated animate__fadeInUp" 
        *ngFor="let n of notificaciones" 
        [class.unread]="!n.leido"
        (click)="marcarComoLeida(n)">
        
        <div class="avatar-box">
          <img [src]="n.foto">
          <div class="status-icon" [ngClass]="n.tipo">
            <ion-icon name="checkmark-outline" *ngIf="n.tipo === 'confirmado'"></ion-icon>
            <ion-icon name="time-outline" *ngIf="n.tipo === 'pendiente'"></ion-icon>
            <ion-icon name="close-outline" *ngIf="n.tipo === 'rechazado'"></ion-icon>
          </div>
        </div>

        <div class="content-box">
          <div class="header-row">
            <h3>{{ n.titulo }}</h3>
            <div class="unread-dot" *ngIf="!n.leido"></div>
          </div>
          <p>{{ n.mensaje }}</p>
          <span class="time-stamp">{{ n.fecha }}</span>
        </div>

      </div>
    </div>

    <ng-template #emptyState>
      <div class="empty-box animate__animated animate__fadeIn">
        <ion-icon name="notifications-off-outline"></ion-icon>
        <h3>No tienes notificaciones</h3>
        <p>Aquí aparecerán tus alertas sobre reservas y solicitudes.</p>
      </div>
    </ng-template>

  </div>
</ion-content>

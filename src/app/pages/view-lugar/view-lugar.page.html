<ion-content [fullscreen]="true" class="profile-bg">
  
  <div class="back-navigation">
    <app-back routerLink="/home"></app-back>
  </div>

  <div class="venue-hero">
    <img [src]="lugar?.foto || 'assets/default-venue.jpg'" class="hero-img" />
    <div class="hero-overlay">
      <ion-badge color="warning" mode="ios">Destacado</ion-badge>
      <h1>{{ lugar?.nombre }}</h1>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="info-section">
      <div class="info-item">
        <ion-icon name="location-outline" color="primary"></ion-icon>
        <p><strong>Ubicación:</strong> {{ lugar?.direccion }}</p>
      </div>
      
      <div class="info-item">
        <ion-icon name="people-outline" color="primary"></ion-icon>
        <p><strong>Capacidad:</strong> {{ lugar?.capacidad }} personas</p>
      </div>
    </div>

    <hr class="divider">

    <div class="details-section">
      <h3>Sobre el lugar</h3>
      <p class="description-text">{{ lugar?.descripcion }}</p>
    </div>

    <div class="equipment-section" *ngIf="lugar?.equipamiento">
      <h3>Equipamiento</h3>
      <ion-chip *ngFor="let item of lugar?.equipamiento">
        <ion-label>{{ item }}</ion-label>
      </ion-chip>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <app-action-calendar (click)="solicitarPerformance(lugar)"></app-action-calendar>
</ion-footer>

<ion-content [fullscreen]="true">
  
  <header class="header animate__animated animate__fadeIn">
    <ion-buttons>
      <ion-back-button defaultHref="/detalles-musicales" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <img src="assets/animations/logoHeader.gif" alt="Logo Jawy" class="jawyLogo">
  </header>

  <div class="body animate__animated animate__fadeIn">
    <main class="todoBody">
      
      <div class="textos">
        <h1><strong>Háblanos de tí</strong></h1>
        <p>Llena los espacios para que puedan conocerte mejor</p>
      </div>

      <div class="formulario">
        
        <div class="inputs">
          
          <div class="imagen-Perfil" (click)="seleccionarFoto()">
            <div class="avatar-circle">
              <ion-icon name="person-outline" *ngIf="!imagePreview"></ion-icon>
              <img [src]="imagePreview" *ngIf="imagePreview">
              <div class="add-button">
                <ion-icon name="add"></ion-icon>
              </div>
            </div>

            <p>Añadir foto de perfil</p>
            
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display: none;">
          </div>

          <div class="Input">
            <h4><strong>Cuentanos sobre tí</strong></h4>
            <ion-textarea 
              class="inputsRegistro jawy-textarea"
              placeholder="Danos una breve descripción de quien eres" 
              [autoGrow]="true" 
              rows="4"
              [(ngModel)]="descripcion">
            </ion-textarea>
          </div>

        </div>

        <footer class="footer">
          <ion-button expand="block" mode="ios" class="btnFill" (click)="siguiente()" [disabled]="!descripcion">
            Siguiente
          </ion-button>
        </footer>

      </div>

    </main>
  </div>

</ion-content>

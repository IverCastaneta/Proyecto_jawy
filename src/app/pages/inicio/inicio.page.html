<ion-content [fullscreen]="true">

  <div class="bgGif">
    <video #bgVideo src="assets/video/BG_Inicio1.mp4" class="background-gif" autoplay loop [muted]="true" playsinline></video>
  </div>

  <div class="todo">

    <div class="logo">
      <img src="assets/animations/Logo.gif" alt="Logo animado Jawy">
    </div>

    <div class="contenido">
      
      <div class="texto">
        <h3><strong>¡Bienvenido a <span class="destacado">Jawy</span>!</strong></h3>
        <h6>
          Reserva espacios para tus tocadas, promueve tu arte, ve los eventos locales 
          y mucho más sobre la escena <strong>musical en La Paz</strong>.
        </h6>
      </div>

      <div class="botones">
        <ion-button expand="block" mode="ios" class="btnFill" routerLink="/login">
          <strong>Inicia sesión</strong>
        </ion-button>

        <ion-button expand="block" mode="ios" fill="outline" class="boton-google" (click)="loginGoogle()">
          Inicia sesión con Google
        </ion-button>
      </div>

      <div class="registro">
        <a routerLink="/register">¿No tienes cuenta? Registrate</a>
      </div>

    </div>

  </div>
</ion-content>

<ion-content [fullscreen]="true">
  
  <header class="header animate__animated animate__fadeIn">
    <ion-buttons>
      <ion-back-button defaultHref="/informacion-personal" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <img src="./assets/img/logo.png" alt="Logo Jawy" class="jawy-logo-small">
  </header>

  <div class="body animate__animated animate__fadeIn">
    <main class="contenedor-principal">
      
      <div class="textos">
        <h1><strong><span class="destacado">¿</span>Cómo te van a contactar<span class="destacado">?</span></strong></h1>
        <p>Llena los espacios para que puedan conocerte mejor</p>
      </div>

      <form [formGroup]="contactoForm" class="formulario">
        
        <div class="inputs">
          
          <div class="grupo-input">
            <label>Correo electrónico</label>
            <ion-input 
              type="email" 
              placeholder="ejemplo@gmail.com" 
              formControlName="email" 
              class="jawy-text-inputs">
            </ion-input>
          </div>

          <div class="grupo-input">
            <label>Número de contacto</label>
            <ion-input 
              type="tel" 
              placeholder="+591 00000000" 
              formControlName="telefono" 
              class="jawy-text-inputs">
            </ion-input>
          </div>

        </div>

        <footer class="footer">
          <ion-button expand="block" mode="ios" class="btn-jawy-primary" (click)="siguiente()" [disabled]="!contactoForm.valid">
            Siguiente
          </ion-button>
        </footer>

      </form>

    </main>
  </div>

</ion-content>

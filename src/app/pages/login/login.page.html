<ion-header class="ion-no-border">
  <ion-toolbar color="tertiary">
    <div class="header-content">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/" text=""></ion-back-button>
      </ion-buttons>
      
      <img src="./assets/img/logo.png" alt="Logo Jawy" class="jawy-logo-small">
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="login-content-final" color="tertiary">
  <div class="form-container">
    
    <h1 style="padding-top: 5vh;">
    <span class="naranja">¡</span>Inicia sesión<span class="naranja">!</span>
    </h1>
    <p class="subtitle">Ingresa a tu cuenta</p>

    <form [formGroup]="form" (ngSubmit)="onSubmitForm()">
      
      <ion-input 
        label="Nombre" 
        labelPlacement="floating" 
        formControlName="email"
        class="custom-input-solid"
      ></ion-input>
      
      <ion-input
        label="Contraseña" 
        labelPlacement="floating" 
        formControlName="password"
        type="password"
        class="custom-input-solid"
      ></ion-input>
      
      <ion-button 
        expand="block"
        color="primary" 
        type="submit"
        class="main-button"
      > 
        Ingresar
      </ion-button>
    </form>
    
    <div class="register-link-container">
      <p class="ion-text-center">¿No tienes cuenta? 
        <a routerLink="/register/" class="register-link">Regístrate</a>
      </p>
    </div>

  </div>
</ion-content>
